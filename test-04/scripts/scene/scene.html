<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>SCENE-T04-OK</title>
<style>html,body{margin:0;background:#0b0e1a;overflow:hidden}#hud{position:fixed;top:8px;left:8px;color:#7cf;font:16px monospace}</style>
</head><body>
<canvas id="c"></canvas><div id="hud">boot</div>
<script>
const cv=document.getElementById('c'),x=cv.getContext('2d');
function fit(){cv.width=innerWidth;cv.height=innerHeight}fit();addEventListener('resize',fit);
let t0=performance.now(),frames=0,fps=0,last=t0;
function loop(now){
  frames++; if(now-last>=1000){fps=Math.round(frames*1000/(now-last));frames=0;last=now;
    document.title='SCENE-T04-OK | '+fps+'fps | '+cv.width+'x'+cv.height;}
  const w=cv.width,h=cv.height,t=(now-t0)/1000;
  x.fillStyle='#0b0e1a';x.fillRect(0,0,w,h);
  for(let i=0;i<40;i++){const a=t*0.8+i*0.157,r=(i%5+1)*60+40*Math.sin(t+i);
    x.beginPath();x.arc(w/2+Math.cos(a)*r,h/2+Math.sin(a*1.3)*r,8+4*Math.sin(t*2+i),0,7);
    x.fillStyle='hsl('+(i*9+t*40)%360+',80%,60%)';x.fill();}
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script></body></html>
